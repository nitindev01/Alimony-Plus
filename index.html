<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Alimony Plus – Legal Tech Navigator</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--indigo:#1d2b64;--violet:#5b4bd5;--teal:#0f9d8a;--saffron:#f59e0b;--rose:#e5527a;--sky:#2e8bf0;--green:#2e9e5b;
--bg:#f4f6fd;--card:#fff;--tx:#1b2430;--mut:#5b6675;--bd:#e3e7f5;--h:#1d2b64;--soft:#e7f7f4}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141f;--card:#1a2030;--tx:#e8edf3;--mut:#a3aebd;--bd:#2b3448;--h:#b9c4ff;--soft:#13302d}}
:root[data-theme="dark"]{--bg:#10141f;--card:#1a2030;--tx:#e8edf3;--mut:#a3aebd;--bd:#2b3448;--h:#b9c4ff;--soft:#13302d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:16px/1.55 'Noto Sans','Noto Sans Devanagari',Roboto,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;
background:radial-gradient(circle at 10% 0,rgba(91,75,213,.14),transparent 40%),radial-gradient(circle at 100% 20%,rgba(15,157,138,.14),transparent 35%),var(--bg)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;color:#fff;padding:10px 14px;background:linear-gradient(110deg,var(--indigo),var(--violet))}
.top{display:flex;align-items:center;gap:8px}.brand{font-weight:800;font-size:1.2rem}
.lang{margin-left:auto;display:flex;border-radius:10px;overflow:hidden}
.lang button{border:0;padding:6px 12px;background:rgba(255,255,255,.8);color:#1d2b64;cursor:pointer;font:inherit}
.lang button.on{background:#fff;font-weight:800;box-shadow:inset 0 -3px var(--saffron)}
nav{display:flex;gap:2px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;margin-top:6px}nav::-webkit-scrollbar{display:none}
nav a{color:#fff;text-decoration:none;padding:8px 10px;border-bottom:2px solid transparent;font-size:.88rem;opacity:.9}
nav a.on{font-weight:800;border-color:#fff;opacity:1}
main{flex:1;width:100%;max-width:960px;margin:0 auto;padding:16px}
h1{margin:.2em 0 .5em;font-size:1.8rem;color:var(--h);font-weight:800}
.mut{color:var(--mut)}
.hero{color:#fff;border-radius:28px;padding:28px;display:flex;flex-direction:column-reverse;align-items:center;gap:18px;box-shadow:0 18px 40px rgba(29,43,100,.3);background:linear-gradient(135deg,var(--indigo),var(--violet) 60%,var(--teal) 130%)}
@media(min-width:760px){.hero{flex-direction:row;padding:48px}}
.hero h1{color:#fff;font-size:2.3rem;margin:.3em 0}.hero svg{width:210px;flex:none}@media(min-width:760px){.hero svg{width:300px}}
.chip{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:4px 14px;font-size:.85rem}
.btn{display:inline-block;border:0;border-radius:99px;padding:11px 22px;min-height:44px;cursor:pointer;text-decoration:none;font:inherit;font-weight:700;color:#fff;background:linear-gradient(110deg,var(--indigo),var(--violet));box-shadow:0 6px 16px rgba(91,75,213,.3)}
.btn.s{background:var(--saffron);color:#1b1b1b;box-shadow:none}.btn.g{background:none;border:1px solid rgba(255,255,255,.7);box-shadow:none}
.btn.o{background:none;color:var(--h);border:1px solid var(--bd);box-shadow:none}.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:12px;grid-template-columns:1fr;margin:16px 0}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}@media(min-width:860px){.grid.t{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 4px 18px rgba(29,43,100,.07);transition:.2s;color:inherit;text-decoration:none;display:block}
a.card:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(29,43,100,.16)}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;margin-bottom:10px}
.card h3{margin:.1em 0}
label{display:block;font-size:.9rem;margin:12px 0 4px;font-weight:600}
input[type=text],input[type=number],input[type=date],select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px}
input:disabled,select:disabled{opacity:.5}
.na{display:flex;gap:7px;align-items:center;font-size:.85rem;color:var(--mut);margin-top:4px}
.alert{border-radius:14px;padding:12px 14px;margin:12px 0;border:1px solid var(--bd);border-left:6px solid var(--sky);background:var(--card)}
.alert.ok{border-left-color:var(--green)}.alert.w{border-left-color:var(--saffron)}.alert.e{border-left-color:var(--rose)}
.tag{display:inline-block;border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:700}
details{border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin-top:8px;background:var(--card)}summary{cursor:pointer;font-weight:700}
ul.ck{list-style:none;padding:0;margin:8px 0 0}ul.ck li{padding-left:24px;position:relative;margin-bottom:6px;font-size:.92rem}ul.ck li:before{content:"✓";position:absolute;left:0;font-weight:800;color:var(--c)}
.priv{display:flex;gap:14px;align-items:center;padding:18px;border-radius:20px;background:var(--soft);border:1px solid rgba(15,157,138,.4)}
.chat{display:flex;flex-direction:column;gap:8px;margin:12px 0}.msg{padding:10px 14px;border-radius:16px;max-width:85%;background:var(--card);border:1px solid var(--bd)}
.msg.me{align-self:flex-end;background:var(--violet);color:#fff;border-color:var(--violet)}
.todo{font-size:.78rem;color:var(--mut);font-style:italic;margin-top:10px}
footer{text-align:center;padding:20px 14px;margin-top:28px;color:#fff;font-size:.88rem;background:linear-gradient(110deg,var(--indigo),var(--violet))}
dialog{border:0;border-radius:20px;padding:22px;max-width:380px;background:var(--card);color:var(--tx)}dialog::backdrop{background:rgba(0,0,0,.45)}
</style></head><body>
<header><div class="top"><span class="brand" id="brand"></span><div class="lang"><button data-l="en">EN</button><button data-l="hi">हिं</button></div></div><nav id="nav"></nav></header>
<main id="app"></main>
<footer><div><b id="disc"></b></div><small style="opacity:.8">© Alimony Plus · Women Helpline 181 · Police 112 · NALSA 15100</small></footer>
<dialog id="dlg"><h3 style="margin-top:0">Share with legal aid?</h3><p class="mut">Only the details you choose are shared. You can stop at any time.</p><label style="display:flex;gap:8px;font-weight:400"><input type="checkbox" id="cons"> I consent to share my contact request</label><div class="row" style="margin-top:16px"><button class="btn o" id="no">Cancel</button><button class="btn" id="yes" disabled>Send</button></div></dialog>
<script>
/* i18n placeholder – swap for next-intl later. Hindi needs legal-translator review. */
const D={en:{brand:"Alimony Plus",home:"Home",intake:"Guided Intake",navigator:"Pathways",calculator:"Calculator",documents:"Documents",timeline:"Case Timeline",aid:"Legal Aid",assistant:"AI Assistant",support:"Financial Support",admin:"Admin CMS",na:"Not available",tag:"Understand your maintenance options, step by step.",start:"Start My Case",track:"Track My Case",disc:"This is not legal advice. Court decides final outcome."},
hi:{brand:"एलिमनी प्लस",home:"होम",intake:"जानकारी",navigator:"कानूनी मार्ग",calculator:"कैलकुलेटर",documents:"दस्तावेज़",timeline:"केस समयरेखा",aid:"कानूनी सहायता",assistant:"AI सहायक",support:"आर्थिक सहायता",admin:"एडमिन",na:"उपलब्ध नहीं",tag:"अपने भरण-पोषण के विकल्प चरण-दर-चरण समझें।",start:"मेरा केस शुरू करें",track:"केस ट्रैक करें",disc:"यह कानूनी सलाह नहीं है। अंतिम निर्णय न्यायालय का होता है।"}};
let lang="en";try{lang=localStorage.getItem("lang")||"en"}catch(e){}
const t=k=>D[lang][k]||D.en[k]||k;
const R=["home","intake","navigator","calculator","documents","timeline","aid","assistant","support","admin"];
const C=["--violet","--teal","--saffron","--rose","--sky","--green","--indigo"].map(x=>`var(${x})`);
const S={na:{},v:{},saved:false,dv:[],c:{na:{},v:{},res:null},docs:{},ev:[],f:{type:"Filing",date:"",note:"",amount:""},chat:[],ref:""};
/* Backend stubs – TODO(backend): case tracker, document vault, legal aid handoff, AI assistant (RAG + citations), CMS */
const mods=[["intake","✍️","--violet","Tell us your situation. Skip anything you like."],["navigator","🧭","--teal","See which legal routes may apply."],["calculator","🧮","--saffron","Get an illustrative planning range."],["documents","📁","--sky","Know what to gather before court."],["timeline","🗓️","--rose","Track hearings, orders and payments."],["aid","⚖️","--green","Free legal help via NALSA, DLSA, SLSA."],["assistant","🤖","--violet","Ask questions in Hindi or English."],["support","💛","--teal","Claim, legal aid or emergency help?"]];
const PW=[["BNSS s.144 (earlier CrPC s.125)","Wife, children, parents; any religion.","A Magistrate can order monthly maintenance if a person with means neglects dependants who cannot support themselves.",["Is my income proof enough?","Which Magistrate court has jurisdiction?","Can interim maintenance be claimed?"]],
["HMA s.24 – interim maintenance","Either spouse in an HMA case.","While a marriage case is pending, the court can order monthly support and litigation expenses if the applicant lacks sufficient income.",["Should I file an interim application now?","What income/asset affidavit is needed?","How are litigation expenses requested?"]],
["HMA s.25 – permanent alimony","Either spouse, at or after the decree.","The court may order a lump sum or periodic payment after the decree, considering income, property and conduct. It can be varied later.",["Lump sum or monthly, which suits me?","What factors will the court weigh?","Can the order be changed later?"]],
["HAMA s.18 – Hindu wife's maintenance","Hindu wife, no divorce needed.","A Hindu wife may claim maintenance from her husband in her lifetime, including when living separately for justifiable reasons.",["Do my reasons for living apart qualify?","This or BNSS s.144?","Which documents prove the marriage?"]],
["DV Act s.20 – monetary relief","Women facing domestic violence.","A Magistrate can order monetary relief including maintenance, alongside protection and residence orders.",["What evidence should I keep safely?","Can I get protection and maintenance together?","Who is my Protection Officer?"]],
["SMA ss.36–37 – Special Marriage Act","Spouses married under SMA, 1954.","Section 36 covers interim maintenance during proceedings; section 37 covers permanent alimony at or after the decree.",["Was my marriage registered under SMA?","Interim or permanent stage?","What proof of income is needed?"]],
["Muslim divorced women's route","Divorced Muslim women.","The 1986 Act provides a fair provision and maintenance linked to the iddat period. Courts have also allowed claims under BNSS s.144. The law has evolved, so verify the latest position.",["Which route is better for me?","What about mehr and property?","What is the latest court position?"]]];
const IN=[["marital","Marital status",["Married","Separated","Divorce pending","Divorced"]],["type","Marriage type",["Hindu Marriage Act","Special Marriage Act","Muslim personal law","Christian / Parsi","Other"]],["children","Dependent children","number"],["income","Your monthly income (₹)","number"],["orders","Existing court orders",["None","Interim maintenance","Final maintenance","Protection order","Other"]],["location","City / district and state","text"]];
const CF=[["income","Your monthly income (₹)"],["otherIncome","Other spouse's monthly income (₹)"],["expenses","Your monthly expenses (₹)"],["child","Monthly child costs (₹)"],["liabilities","Other spouse's monthly liabilities (₹)"],["assets","Total assets, both sides (₹)"]];
const SIGNS=["Physical harm or threats","Financial control / money withheld","Forced out of home","Fear for children's safety"];
const DOCS={Identity:"Aadhaar / voter ID, address proof",Income:"Salary slips, ITR, bank statements",Assets:"Property papers, FDs, vehicles",Children:"Birth certificates, school fees","Court orders":"Existing or past orders",Payments:"Receipts, transfer records","DV / safety":"Medical reports, complaints, photos (store safely)"};
const EVC={Filing:"--sky",Hearing:"--saffron",Order:"--violet",Payment:"--green",Arrears:"--rose"};
const inr=n=>"₹"+n.toLocaleString("en-IN");
const h1=k=>`<h1>${t(k)}</h1>`;
const fld=(s,n,l,ty,pre)=>{const o=Array.isArray(ty);return `<label>${l}</label>${o?`<select data-${pre}="${n}" ${s.na[n]?"disabled":""}><option></option>${ty.map(x=>`<option ${s.v[n]===x?"selected":""}>${x}</option>`).join("")}</select>`:`<input type="${ty}" data-${pre}="${n}" value="${s.na[n]?"":s.v[n]||""}" ${s.na[n]?"disabled":""}>`}<div class="na"><input type="checkbox" data-${pre}na="${n}" ${s.na[n]?"checked":""}> ${t("na")}</div>`};
const scales=`<svg viewBox="0 0 320 300" role="img" aria-label="Scales of justice"><defs><linearGradient id="g"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#ffd37a"/></linearGradient></defs><circle cx="160" cy="150" r="130" fill="rgba(255,255,255,.12)"/><circle cx="160" cy="150" r="90" fill="rgba(255,255,255,.12)"/><rect x="154" y="60" width="12" height="190" rx="6" fill="url(#g)"/><rect x="110" y="244" width="100" height="16" rx="8" fill="url(#g)"/><circle cx="160" cy="58" r="12" fill="url(#g)"/><rect x="50" y="76" width="220" height="8" rx="4" fill="url(#g)"/><path d="M62 84 36 160M62 84 88 160M258 84 232 160M258 84 284 160" stroke="#fff" stroke-width="2"/><path d="M26 160h72a36 22 0 0 1-72 0zM222 160h72a36 22 0 0 1-72 0z" fill="#fff"/><circle cx="62" cy="150" r="8" fill="#0f9d8a"/><circle cx="258" cy="150" r="8" fill="#e5527a"/></svg>`;
const P={
home:()=>`<div class="hero"><div><span class="chip">⚖️ Legal Tech Navigator</span><h1>${t("brand")}</h1><p style="opacity:.92;font-size:1.1rem">${t("tag")}</p><div class="row"><a class="btn s" href="#/intake">${t("start")}</a><a class="btn g" href="#/calculator">${t("calculator")}</a><a class="btn g" href="#/timeline">${t("track")}</a><a class="btn g" href="#/aid">${t("aid")}</a></div></div>${scales}</div>
<div class="grid t">${mods.map(([k,i,c,b])=>`<a class="card" href="#/${k}"><div class="ico" style="background:linear-gradient(135deg,var(${c}),var(${c}) 60%,rgba(255,255,255,.3))">${i}</div><h3>${t(k)}</h3><div class="mut" style="font-size:.9rem">${b}</div></a>`).join("")}</div>
<h2 style="color:var(--h)">How it works</h2><div class="grid t">${[["1","Share what you can","Skip anything with “Not available”.","--violet"],["2","See your options","Routes, checklists, planning range.","--teal"],["3","Get real help","Legal aid referral with your consent.","--saffron"]].map(([n,a,b,c])=>`<div class="card" style="border-top:5px solid var(${c})"><div style="font-size:2.2rem;font-weight:800;color:var(${c});line-height:1">${n}</div><h3>${a}</h3><div class="mut">${b}</div></div>`).join("")}</div>
<div class="priv"><span style="font-size:2rem">🔒</span><div><b>Private by design</b><div style="font-size:.92rem">Every question can be skipped with “${t("na")}”. Nothing is sent anywhere until you choose to share it.</div></div></div>`,
intake:()=>`${h1("intake")}<form id="f">${IN.map(([n,l,ty])=>fld(S,n,l,ty,"f")).join("")}<label style="margin-top:18px">Safety signals (optional, private)</label>${SIGNS.map(s=>`<label style="font-weight:400;display:flex;gap:8px;margin:6px 0"><input type="checkbox" data-dv="${s}" ${S.dv.includes(s)?"checked":""}> ${s}</label>`).join("")}${S.dv.length?`<div class="alert w">If you are in danger, call Police 112 or Women Helpline 181.</div>`:""}<p><button class="btn" type="submit">Save for this session</button></p></form>${S.saved?`<div class="alert ok">Kept in this session only. Nothing was uploaded. <a href="#/navigator">See pathways →</a></div>`:""}<div class="todo">TODO(backend: case tracker): saveIntake() creates the case once consent + auth exist.</div>`,
navigator:()=>`${h1("navigator")}<div class="alert">Possible routes only. Which one fits depends on your marriage law, stage and facts. A lawyer should confirm.</div><div class="grid">${PW.map(([ti,w,tx,a],i)=>{const c=C[i%7];return `<div class="card" style="border-top:6px solid ${c};--c:${c}"><h3 style="color:${c}">${ti}</h3><span class="tag" style="background:color-mix(in srgb,${c} 14%,transparent);color:${c}">${w}</span><p>${tx}</p><details><summary>Ask Lawyer checklist</summary><ul class="ck">${a.map(x=>`<li>${x}</li>`).join("")}</ul></details></div>`}).join("")}</div>`,
calculator:()=>{const r=S.c.res;return `${h1("calculator")}<form id="c">${CF.map(([n,l])=>fld(S.c,n,l,"number","c")).join("")}<p><button class="btn" type="submit">Estimate planning range</button></p></form>${r?`<div class="alert"><b>Your monthly shortfall:</b> ${inr(r.s)}<br><b>Illustrative support range:</b> ${r.lo===null?"needs the other spouse's income":inr(r.lo)+" – "+inr(r.hi)}<br><small class="mut">Assumptions: need = expenses + child costs minus your income; range = 20–33% of the other spouse's income after liabilities, capped at the shortfall. Assets are not used in the number. Conduct, marriage duration and standard of living are not modelled. Not legal advice; the court decides the final amount.</small></div>`:""}<div class="todo">TODO(backend: CMS): load assumptions from versioned, lawyer-reviewed config.</div>`},
documents:()=>`${h1("documents")}<div class="alert">Checklist only. Uploads are disabled until the secure vault is connected.</div>${Object.entries(DOCS).map(([k,d])=>`<div class="card" style="margin-bottom:10px"><h3>${k}</h3><div class="mut">${d}</div><label style="font-weight:400;display:flex;gap:8px"><input type="checkbox" data-d="${k}" ${S.docs[k]?"checked":""}> I have this</label><button class="btn o" disabled>Upload (coming soon)</button></div>`).join("")}<div class="todo">TODO(backend: document vault): uploadDocument(category, file) with encrypted storage.</div>`,
timeline:()=>{const sm=x=>S.ev.filter(e=>e.type===x).reduce((s,e)=>s+(+e.amount||0),0),o=sm("Order"),p=sm("Payment"),a=Math.max(o-p,0)+sm("Arrears");return `${h1("timeline")}<form class="card" id="e"><label style="margin-top:0">Event</label><select data-e="type">${Object.keys(EVC).map(x=>`<option ${S.f.type===x?"selected":""}>${x}</option>`).join("")}</select><label>Date (optional)</label><input type="date" data-e="date" value="${S.f.date}"><label>Amount ₹ (optional)</label><input type="number" data-e="amount" value="${S.f.amount}"><label>Note (optional)</label><input type="text" data-e="note" value="${S.f.note}"><p><button class="btn" type="submit">Add to timeline</button></p></form>${S.ev.length?`<div class="alert ${a?"w":"ok"}">Ordered ${inr(o)} · Paid ${inr(p)} · Arrears ${inr(a)} <small class="mut">(simple tally, not a legal computation)</small></div>`:""}${S.ev.map(e=>`<div class="card" style="border-left:6px solid var(${EVC[e.type]});margin-bottom:10px"><span class="tag" style="float:right;background:var(${EVC[e.type]});color:#fff">${e.type}</span><small class="mut">${e.date||"Date not available"}</small>${e.amount?`<h3>${inr(+e.amount)}</h3>`:""}<div class="mut">${e.note||""}</div></div>`).join("")}<div class="todo">TODO(backend: case tracker): GET /api/cases/:id/events; saveEvent() persists.</div>`},
aid:()=>`${h1("aid")}${S.ref?`<div class="alert ok">Demo referral recorded: ${S.ref}</div>`:""}${[["NALSA – National Legal Services Authority","Apex body for free legal services. Helpline 15100.","15100"],["SLSA – State Legal Services Authority","State-level legal aid and Lok Adalats.",""],["DLSA – District Legal Services Authority","Walk-in free legal aid at your district court, for eligible applicants (women, children, low income and others).",""]].map(([a,b,c])=>`<div class="card" style="margin-bottom:10px;border-left:6px solid var(--green)"><h3>${a}</h3><div class="mut">${b}</div>${c?`<p><b>Contact:</b> ${c}</p>`:""}</div>`).join("")}<button class="btn" id="req">Request a referral</button><div class="todo">TODO(backend: legal aid handoff): send only the fields the user consents to.</div>`,
assistant:()=>`${h1("assistant")}<div class="alert">General information only. Don't type names, phone numbers or case numbers.</div><div class="chat">${S.chat.map(m=>`<div class="msg ${m.me?"me":""}">${m.t}${m.src?`<div><span class="tag" style="margin-top:8px;background:var(--bd)">${m.src}</span></div>`:""}</div>`).join("")}</div><form id="q" class="row" style="flex-wrap:nowrap"><input type="text" id="qi" placeholder="${lang==="hi"?"अपना प्रश्न लिखें":"Ask a question"}"><button class="btn" type="submit">Send</button></form><div class="todo">TODO(backend: AI assistant): RAG over CMS-managed law corpus; return answer + sources[].</div>`,
support:()=>`${h1("support")}<div class="grid t">${[["Maintenance claim","A court-ordered, ongoing payment from a spouse (or parent). Takes time; interim orders can help sooner.","--violet"],["Legal aid","Free lawyer and court-fee support via NALSA/SLSA/DLSA for eligible people. It helps you pursue a claim; it is not money for living costs.","--green"],["Emergency assistance","Immediate safety and shelter: Police 112, Women Helpline 181. One Stop Centres can arrange shelter and medical help.","--rose"]].map(([a,b,c])=>`<div class="card" style="border-top:5px solid var(${c})"><h3>${a}</h3><div class="mut">${b}</div></div>`).join("")}</div>`,
admin:()=>`${h1("admin")}<div class="alert w">Placeholder. Staff authentication is required before this area is enabled.</div>${[["Law versions","Track statute text by section and effective date."],["Sources","Citations used by the AI assistant and pathway cards."],["Calculator assumptions","Versioned percentages and caps, with reviewer sign-off."]].map(([a,b])=>`<div class="card" style="margin-bottom:10px"><h3>${a}</h3><div class="mut">${b}</div></div>`).join("")}<div class="todo">TODO(backend: CMS): NextAuth + roles must gate this page.</div>`};
function render(){const k=location.hash.replace("#/","")||"home",r=R.includes(k)?k:"home";document.documentElement.lang=lang;
brand.textContent=t("brand");disc.textContent=t("disc");document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
nav.innerHTML=R.map(x=>`<a href="#/${x}" class="${x===r?"on":""}">${t(x)}</a>`).join("");app.innerHTML=P[r]();bind(r)}
